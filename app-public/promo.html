<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loto Art Studio - Promo experiment</title>
    <style>
      :root {
        color: #171715;
        background: #f3f2ee;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #f3f2ee; }
      button { font: inherit; }
      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 46%, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0) 46%),
          #f3f2ee;
      }
      .brand {
        position: absolute;
        top: 4.8vh;
        left: 5vw;
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        transform: translateY(-8px);
        font-size: 15px;
        font-weight: 680;
        transition: opacity .7s ease, transform .9s cubic-bezier(.16, 1, .3, 1);
      }
      .brand-mark {
        display: grid;
        grid-template-columns: repeat(3, 4px);
        gap: 2px;
        width: 16px;
      }
      .brand-mark i { width: 4px; height: 4px; background: currentColor; border-radius: 1px; }
      .scene.started .brand { opacity: 1; transform: none; }
      .copy {
        position: absolute;
        top: 15vh;
        left: 0;
        right: 0;
        height: 76px;
        text-align: center;
        pointer-events: none;
      }
      .copy p {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        transform: translateY(18px);
        font-size: clamp(30px, 3vw, 52px);
        font-weight: 650;
        letter-spacing: 0;
        transition: opacity .5s ease, transform .9s cubic-bezier(.16, 1, .3, 1);
      }
      .scene[data-stage="0"] .copy [data-copy="0"],
      .scene[data-stage="1"] .copy [data-copy="1"],
      .scene[data-stage="2"] .copy [data-copy="2"],
      .scene[data-stage="3"] .copy [data-copy="3"],
      .scene[data-stage="4"] .copy [data-copy="4"] {
        opacity: 1;
        transform: none;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding-top: 9vh;
        perspective: 1400px;
      }
      .card-shell {
        width: min(79vw, 1180px);
        padding: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: 0 0 0 rgba(32, 30, 25, 0);
        transform: scale(.63);
        transform-origin: center;
        transition:
          transform 1.25s cubic-bezier(.2, 1.18, .28, 1),
          padding 1.15s cubic-bezier(.16, 1, .3, 1),
          border-radius 1.15s cubic-bezier(.16, 1, .3, 1),
          background-color 1s ease,
          box-shadow 1.2s ease;
      }
      .scene[data-stage="2"] .card-shell,
      .scene[data-stage="3"] .card-shell,
      .scene[data-stage="4"] .card-shell { transform: scale(1); }
      .scene[data-stage="3"] .card-shell,
      .scene[data-stage="4"] .card-shell {
        padding: 14px;
        border-radius: 28px;
        background: #ebe9e2;
        box-shadow: 0 30px 80px rgba(41, 38, 31, .16), 0 3px 12px rgba(41, 38, 31, .08);
      }
      .card {
        position: relative;
        width: 100%;
        aspect-ratio: 3 / 1;
      }
      .cell {
        position: absolute;
        left: calc(var(--column) * 11.111111%);
        top: calc(var(--row) * 33.333333%);
        z-index: 1;
        width: 11.111112%;
        height: 33.333334%;
        overflow: hidden;
        border: 1.5px solid #242320;
        border-radius: 0;
        background: #fbfaf7;
        transition:
          left 1.25s cubic-bezier(.2, 1.08, .28, 1),
          top 1.25s cubic-bezier(.2, 1.08, .28, 1),
          width 1.25s cubic-bezier(.2, 1.08, .28, 1),
          height 1.25s cubic-bezier(.2, 1.08, .28, 1),
          border-radius 1.15s cubic-bezier(.16, 1, .3, 1),
          opacity .45s ease,
          transform .85s cubic-bezier(.16, 1, .3, 1),
          box-shadow 1.15s ease;
      }
      .scene[data-stage="3"] .cell,
      .scene[data-stage="4"] .cell {
        border-color: #3e3c37;
        border-radius: 16px;
      }
      .number, .seed-number {
        display: grid;
        place-items: center;
        color: #171715;
        font-size: clamp(26px, 3.6vw, 58px);
        font-weight: 730;
        font-variant-numeric: tabular-nums;
      }
      .seed-number {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: #fbfaf7;
        opacity: 0;
        transition: opacity .45s ease;
      }
      .scene[data-stage="0"] .seed-number { opacity: 1; }
      .art img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.015);
        transition: opacity .65s ease, transform 1.5s cubic-bezier(.16, 1, .3, 1);
      }
      .scene[data-stage="0"] .art img { opacity: 0; transform: scale(.82); }
      .scene[data-stage="4"] .art img { transform: scale(1); }
      .scene[data-stage="4"] .owner-square {
        z-index: 5;
        width: 22.222223%;
        height: 66.666667%;
        box-shadow: 0 9px 24px rgba(30, 28, 23, .15);
      }
      .scene[data-stage="4"] .owner-wide {
        z-index: 5;
        width: 22.222223%;
        box-shadow: 0 9px 24px rgba(30, 28, 23, .15);
      }
      .scene[data-stage="4"] .consumed {
        z-index: 0;
        opacity: 0;
        transform: scale(.76);
      }
      .timeline {
        position: absolute;
        left: 50%;
        bottom: 6.3vh;
        display: flex;
        gap: 7px;
        transform: translateX(-50%);
      }
      .timeline i {
        width: 22px;
        height: 3px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(23, 23, 21, .16);
      }
      .timeline i::after {
        content: "";
        display: block;
        width: 100%;
        height: 100%;
        background: #171715;
        transform: translateX(-105%);
        transition: transform .55s ease;
      }
      .scene[data-stage="0"] .timeline i:nth-child(1)::after,
      .scene[data-stage="1"] .timeline i:nth-child(-n+2)::after,
      .scene[data-stage="2"] .timeline i:nth-child(-n+3)::after,
      .scene[data-stage="3"] .timeline i:nth-child(-n+4)::after,
      .scene[data-stage="4"] .timeline i::after { transform: none; }
      .replay {
        position: absolute;
        right: 4.6vw;
        bottom: 4.8vh;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(23, 23, 21, .2);
        border-radius: 50%;
        background: rgba(255, 255, 255, .56);
        color: #171715;
        font-size: 21px;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transform: scale(.8);
        transition: opacity .4s ease, transform .7s cubic-bezier(.16, 1, .3, 1), background-color .2s ease;
      }
      .replay:hover { background: white; }
      .scene.finished .replay { opacity: 1; transform: none; }
      @media (max-width: 600px) {
        .brand { top: 4vh; left: 4vw; font-size: 11px; }
        .copy { top: 14vh; }
        .copy p { font-size: 22px; }
        .stage { padding-top: 6vh; }
        .card-shell { width: 94vw; }
        .scene[data-stage="3"] .card-shell,
        .scene[data-stage="4"] .card-shell { padding: 5px; border-radius: 12px; }
        .scene[data-stage="3"] .cell,
        .scene[data-stage="4"] .cell { border-radius: 6px; }
        .number, .seed-number { font-size: 15px; }
        .timeline { bottom: 4vh; }
        .replay { right: 4vw; bottom: 2.8vh; width: 32px; height: 32px; }
      }
      @media (max-width: 600px) and (max-height: 300px) {
        .brand { display: none; }
        .copy { top: 9px; height: 24px; }
        .copy p { font-size: 16px; }
        .stage { display: flex; align-items: flex-start; justify-content: center; padding: 48px 0 0; }
        .card-shell { width: 92vw; }
        .timeline { bottom: 6px; }
        .replay { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .card-shell, .cell, .copy p, .brand { transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="scene" data-stage="0">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </span>
        Loto Art Studio
      </div>
      <div class="copy" aria-live="polite">
        <p data-copy="0">A familiar game.</p>
        <p data-copy="1">Now, add art.</p>
        <p data-copy="2">Give art more room.</p>
        <p data-copy="3">Soften every edge.</p>
        <p data-copy="4">Let the images lead.</p>
      </div>
      <section class="stage" aria-label="Animated art loto card">
        <div class="card-shell">
          <div class="card"></div>
        </div>
      </section>
      <div class="timeline" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <button class="replay" type="button" title="Replay animation" aria-label="Replay animation">↻</button>
    </main>
    <script>
      const artwork = {
        1: ["owner-square", "library/commons-la-nuit-toile.jpg", "Starry Night"],
        2: ["consumed", "library/override-commons-impression-soleil-levant.jpg", "Impression, Sunrise"],
        5: ["", "library/commons-la-liberte-guidant-le-peuple.jpg", "Liberty Leading the People"],
        8: ["", "library/commons-la-joconde.jpg", "Mona Lisa"],
        10: ["consumed", "library/override-met-253370.jpg", "David"],
        11: ["consumed", "library/commons-la-cne.jpg", "The Last Supper"],
        16: ["", "library/commons-la-jeune-fille-la-perle.jpg", "Girl with a Pearl Earring"],
        18: ["", "library/commons-la-naissance-de-vnus.jpg", "The Birth of Venus"],
        20: ["", "library/commons-le-cri.jpg", "The Scream"],
        22: ["owner-wide", "library/commons-la-grande-vague-de-kanagawa.jpg", "The Great Wave"],
        23: ["consumed", "library/commons-la-cration-d-adam.jpg", "The Creation of Adam"],
        26: ["", "library/commons-les-iris.jpg", "Irises"],
      };
      const numbers = [
        1, 12, 24, 33, 41, 52, 63, 70, 81,
        6, 18, 28, 36, 44, 59, 67, 74, 84,
        8, 14, 29, 38, 47, 58, 65, 77, 88,
      ];
      const card = document.querySelector(".card");
      for (let index = 0; index < 27; index += 1) {
        const cell = document.createElement("div");
        cell.style.setProperty("--column", index % 9);
        cell.style.setProperty("--row", Math.floor(index / 9));
        if (artwork[index]) {
          const [role, source, title] = artwork[index];
          cell.className = `cell art ${role}`;
          cell.innerHTML = `<span class="seed-number">${numbers[index]}</span><img src="${source}" alt="${title}">`;
        } else {
          cell.className = "cell number";
          cell.textContent = numbers[index];
        }
        card.append(cell);
      }

      const scene = document.querySelector(".scene");
      const replay = document.querySelector(".replay");
      const schedule = [];
      function later(callback, delay) {
        const timer = window.setTimeout(callback, delay);
        schedule.push(timer);
      }
      function play() {
        schedule.splice(0).forEach(window.clearTimeout);
        scene.classList.remove("started", "finished");
        scene.dataset.stage = "-1";
        requestAnimationFrame(() => requestAnimationFrame(() => {
          scene.classList.add("started");
          scene.dataset.stage = "0";
          later(() => { scene.dataset.stage = "1"; }, 2200);
          later(() => { scene.dataset.stage = "2"; }, 4400);
          later(() => { scene.dataset.stage = "3"; }, 6800);
          later(() => { scene.dataset.stage = "4"; }, 9200);
          later(() => { scene.classList.add("finished"); }, 12500);
        }));
      }
      replay.addEventListener("click", play);
      play();
    </script>
  </body>
</html>
